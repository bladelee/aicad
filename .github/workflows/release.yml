# 发布流水线：tag v* 触发 → build 镜像 → 冒烟测试 → push ghcr.io → 附 Release
#
# 决策依据 docs/06-工程实操/发布与部署完整方案.md（2026-08-09 已确认）：
#   - ghcr.io 公开分发
#   - 主镜像 floorplan-mcp 不含 libredwg（GPL 隔离）；libredwg-cli 独立镜像
#
# 镜像地址：
#   ghcr.io/bladelee/floorplan-mcp:<tag>
#   ghcr.io/bladelee/libredwg-cli:<tag>
#
# 本地验证（不起 CI 也能跑同款检查）：
#   docker build -f floorplan-mcp/Dockerfile -t floorplan-mcp:test .
#   docker run --rm floorplan-mcp:test floorplan --help

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  FLOORPLAN_IMAGE: ghcr.io/${{ github.repository_owner }}/floorplan-mcp
  LIBREDWG_IMAGE: ghcr.io/${{ github.repository_owner }}/libredwg-cli

permissions:
  contents: write      # 创建 GitHub Release + 上传产物
  packages: write      # push ghcr.io

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── 1. 主镜像 floorplan-mcp（FreeCAD + ezdxf + CLI + MCP）───
      - name: Build floorplan-mcp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: floorplan-mcp/Dockerfile
          load: true
          tags: |
            ${{ env.FLOORPLAN_IMAGE }}:${{ github.ref_name }}
            ${{ env.FLOORPLAN_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── 2. 独立镜像 libredwg-cli（DWG↔DXF 翻译官，GPL 隔离）───
      - name: Build libredwg-cli
        uses: docker/build-push-action@v6
        with:
          context: tools/dwg_to_dxf
          file: tools/dwg_to_dxf/Dockerfile.libredwg
          load: true
          tags: |
            ${{ env.LIBREDWG_IMAGE }}:${{ github.ref_name }}
            ${{ env.LIBREDWG_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─── 3. 冒烟测试（不 push 就发现的错不浪费用户下载）───
      - name: Smoke test — CLI 入口
        run: |
          echo "== floorplan --help =="
          docker run --rm ${{ env.FLOORPLAN_IMAGE }}:${{ github.ref_name }} floorplan --help

      - name: Write smoke fixtures
        id: smoke-fixture
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cat > "$RUNNER_TEMP/smoke/mkfixture.py" <<'PYEOF'
          import os, ezdxf
          out = os.environ["SMOKE_DIR"]
          doc = ezdxf.new("R2018")
          msp = doc.modelspace()
          msp.add_line((0,0),(10000,0), dxfattribs={"layer":"A原建筑墙体"})
          msp.add_line((0,0),(0,8000),  dxfattribs={"layer":"A原建筑墙体"})
          handle = msp[0].dxf.handle
          doc.saveas(os.path.join(out, "fixture.dxf"))
          print("WALL_HANDLE=%s" % handle)
          PYEOF
          # heredoc 结束符必须顶格，但 YAML block 内不能顶格 —— 用 sed 去缩进
          sed -i 's/^          //' "$RUNNER_TEMP/smoke/mkfixture.py"
          python3 -m pip install --quiet ezdxf
          SMOKE_DIR="$RUNNER_TEMP/smoke" python3 "$RUNNER_TEMP/smoke/mkfixture.py" > "$RUNNER_TEMP/smoke/handle.txt"
          HANDLE=$(grep -oE 'WALL_HANDLE=\S+' "$RUNNER_TEMP/smoke/handle.txt" | cut -d= -f2)
          echo "HANDLE=$HANDLE" >> "$GITHUB_OUTPUT"
          echo "== fixture wall handle: $HANDLE =="

      - name: Smoke test — CLI 真实功能（改墙 500mm）
        env:
          HANDLE: ${{ steps.smoke-fixture.outputs.HANDLE }}
        run: |
          SMOKE=$RUNNER_TEMP/smoke
          docker run --rm -v "$SMOKE:/data" \
            ${{ env.FLOORPLAN_IMAGE }}:${{ github.ref_name }} \
            move-wall --dxf /data/fixture.dxf --handle "$HANDLE" --dx 500 --out /data/fixture_moved.dxf

          echo "== verify in-image (input intact + wall moved 500mm) =="
          cat > "$SMOKE/verify.py" <<'PYEOF'
          import ezdxf, os
          assert os.path.exists("/data/fixture.dxf"), "input file was clobbered!"
          a = ezdxf.readfile("/data/fixture.dxf")
          b = ezdxf.readfile("/data/fixture_moved.dxf")
          ha = [e for e in a.modelspace() if e.dxftype()=="LINE"][0]
          hb = [e for e in b.modelspace() if e.dxftype()=="LINE"][0]
          dx = hb.dxf.start.x - ha.dxf.start.x
          print(f"dx = {dx:.1f}")
          assert abs(dx - 500.0) < 0.01, "wall did not move 500mm!"
          print("SMOKE OK - input intact, wall moved exactly 500mm")
          PYEOF
          sed -i 's/^          //' "$SMOKE/verify.py"
          docker run --rm -i -v "$SMOKE:/data" --entrypoint /opt/FreeCAD/usr/bin/python \
            -e PYTHONHOME=/opt/FreeCAD/usr -e LD_LIBRARY_PATH=/opt/FreeCAD/usr/lib \
            ${{ env.FLOORPLAN_IMAGE }}:${{ github.ref_name }} - < "$SMOKE/verify.py"

      - name: Smoke test — pytest（镜像内置测试）
        run: |
          docker run --rm --entrypoint /opt/FreeCAD/usr/bin/python \
            ${{ env.FLOORPLAN_IMAGE }}:${{ github.ref_name }} \
            -m pytest /opt/aicad/tools/core/test_core_api.py -q

      # ─── 4. push ghcr.io（冒烟全绿才推）───
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push floorplan-mcp
        run: |
          docker push ${{ env.FLOORPLAN_IMAGE }}:${{ github.ref_name }}
          docker push ${{ env.FLOORPLAN_IMAGE }}:latest

      - name: Push libredwg-cli
        run: |
          docker push ${{ env.LIBREDWG_IMAGE }}:${{ github.ref_name }}
          docker push ${{ env.LIBREDWG_IMAGE }}:latest

      # ─── 5. 附产物到 GitHub Release（离线安装用 tar）───
      # runner 磁盘坑（实战教训 2026-08-16）:
      #   - docker save 落未压缩 .tar 再 gzip → 磁盘峰值翻倍 → no space left
      #   - GitHub Release 单文件上限 2GiB → 超限必须分段
      - name: Save offline tar (piped gzip, disk-friendly)
        run: |
          df -h / | tail -1
          # 镜像已 push，build 缓存不再需要 — 先释放几 GB
          docker builder prune -af || true
          df -h / | tail -1
          mkdir -p dist
          # 管道直灌 gzip，不落未压缩中间 .tar
          docker save ${{ env.LIBREDWG_IMAGE }}:${{ github.ref_name }} | gzip > dist/libredwg-cli-${{ github.ref_name }}.tar.gz
          docker save ${{ env.FLOORPLAN_IMAGE }}:${{ github.ref_name }} | gzip > dist/floorplan-mcp-${{ github.ref_name }}.tar.gz
          # GitHub Release 单文件限 2GiB；超限分成 1900m 段（cat 合并后 docker load）
          for f in dist/*.tar.gz; do
            if [ "$(stat -c%s "$f")" -gt 2038439360 ]; then
              echo "== splitting $f (>2GiB) =="
              split -b 1900m -d "$f" "$f."
              rm "$f"
            fi
          done
          ls -lh dist/

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 快速开始

            ```bash
            docker pull ghcr.io/bladelee/floorplan-mcp:${{ github.ref_name }}
            docker pull ghcr.io/bladelee/libredwg-cli:${{ github.ref_name }}

            # DWG → DXF（每项目首次一次）
            docker run --rm -v "$PWD:/data" ghcr.io/bladelee/libredwg-cli:${{ github.ref_name }} \
              -y -o /data/out.dxf /data/your.dwg

            # 改墙 +500mm（CLI 原型）
            docker run --rm -v "$PWD:/data" ghcr.io/bladelee/floorplan-mcp:${{ github.ref_name }} \
              move-wall --dxf /data/out.dxf --handle <HANDLE> --dx 500 --out /data/moved.dxf
            ```

            ## 离线安装（无外网环境）

            下载下方 tar.gz 附件后：
            ```bash
            # 若附件是分段的（.00/.01...），先合并：
            cat floorplan-mcp-${{ github.ref_name }}.tar.gz.* > floorplan-mcp.tar.gz
            docker load < floorplan-mcp.tar.gz
            docker load < libredwg-cli-${{ github.ref_name }}.tar.gz
            ```

            详细文档见仓库 `docs/01-产品/客户部署使用手册.md`。
          files: dist/*
